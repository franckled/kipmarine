workflows:
  kipmarine-ios-validation:
    name: KipMarine - iOS validation
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feature/v6-mediterranean-ui
          include: true
          source: true
        - pattern: work/v6-live-marine-weather-tides
          include: true
          source: true
        - pattern: feature/v6-multilingual
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Resolve Flutter dependencies
        script: flutter pub get
      - name: Install SVG icon renderer
        script: npm install --no-save --no-package-lock @resvg/resvg-js
      - name: Render KipMarine app icon
        script: node tooling/render_icon.cjs
      - name: Generate iOS and Android launcher icons
        script: dart run flutter_launcher_icons
      - name: Static analysis
        script: flutter analyze
      - name: Unit tests
        script: flutter test
      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/iphoneos/*.dSYM
      - flutter_drive.log

  kipmarine-v6-testflight:
    name: KipMarine V6 - TestFlight signé
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Ce workflow est volontairement manuel : il ne publie rien à chaque push.
    # L'intégration App Store Connect est utilisée pour la publication.
    integrations:
      app_store_connect: CodeMagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kipmarine.app

    scripts:
      - name: Résoudre les dépendances Flutter
        script: flutter pub get
      - name: Install SVG icon renderer
        script: npm install --no-save --no-package-lock @resvg/resvg-js
      - name: Render KipMarine app icon
        script: node tooling/render_icon.cjs
      - name: Générer les icônes iOS et Android
        script: dart run flutter_launcher_icons
      - name: Analyse statique
        script: flutter analyze
      - name: Tests unitaires
        script: flutter test
      - name: Installer les dépendances CocoaPods
        script: cd ios && pod install
      - name: Configurer la signature iOS
        script: xcode-project use-profiles
      - name: Construire l'IPA signé pour TestFlight
        script: |
          set -euo pipefail
          # App Store Connect a déjà reçu le build 10 : le prochain commence au build 11.
          PROJECT_SEQUENCE="${PROJECT_BUILD_NUMBER:-1}"
          if ! [[ "$PROJECT_SEQUENCE" =~ ^[0-9]+$ ]]; then
            echo "PROJECT_BUILD_NUMBER invalide : $PROJECT_SEQUENCE"
            exit 1
          fi
          BUILD_NUMBER=$((PROJECT_SEQUENCE + 10))
          if (( BUILD_NUMBER <= 10 )); then
            echo "Le numéro de build iOS doit être supérieur au dernier build App Store Connect (10)."
            exit 1
          fi
          echo "Build iOS App Store Connect : $BUILD_NUMBER"
          flutter build ipa --release --build-name=1.0.0 --build-number="$BUILD_NUMBER" --export-options-plist=/Users/builder/export_options.plist
      - name: Vérifier la signature App Store avant l'envoi à Apple
        script: |
          # Bloque l'envoi si l'IPA n'est pas signé avec un certificat de
          # distribution (cause du rejet Apple ITMS-90035 du build 249).
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          CHECK_DIR=$(mktemp -d)
          unzip -q "$IPA" -d "$CHECK_DIR"
          APP="$CHECK_DIR/Payload/Runner.app"

          echo "--- Méthode d'export demandée ---"
          /usr/libexec/PlistBuddy -c "Print :method" /Users/builder/export_options.plist || true

          echo "--- Certificat utilisé ---"
          AUTHORITY=$(codesign -dvv "$APP" 2>&1 | grep '^Authority=' | head -n 1)
          echo "$AUTHORITY"

          echo "--- Profil intégré ---"
          security cms -D -i "$APP/embedded.mobileprovision" > "$CHECK_DIR/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Name" "$CHECK_DIR/profile.plist"

          codesign --verify --deep --strict --verbose=2 "$APP"

          if ! echo "$AUTHORITY" | grep -Eq 'Apple Distribution|iPhone Distribution'; then
            echo "ERREUR : l'app n'est pas signée avec un certificat de distribution."
            echo "Dans Codemagic > Teams > Code signing identities, ajoute un certificat"
            echo "« Apple Distribution » ou laisse Codemagic en générer un depuis l'intégration."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$CHECK_DIR/profile.plist" >/dev/null 2>&1; then
            echo "ERREUR : profil Development/Ad Hoc détecté (liste d'appareils présente)."
            echo "Il faut un profil de type App Store pour com.kipmarine.app."
            exit 1
          fi
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$CHECK_DIR/profile.plist" 2>/dev/null || echo false)" = "true" ]; then
            echo "ERREUR : get-task-allow est activé, ce qui indique une signature de développement."
            exit 1
          fi
          echo "Signature App Store valide : envoi à App Store Connect autorisé."
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Upload vers App Store Connect/TestFlight sans soumettre à l'examen
        # bêta externe. Après traitement Apple, activer ce build pour les
        # testeurs internes dans App Store Connect si nécessaire.
