name: KipMarine Android (APK + AAB)

# Lancement manuel : onglet Actions > « KipMarine Android (APK + AAB) » >
# Run workflow. La branche compilée est celle indiquée dans le champ
# « Branche de l'application à compiler ».
on:
  workflow_dispatch:
    inputs:
      branche:
        description: "Branche de l'application à compiler"
        required: true
        default: feature/v6-multilingual
  push:
    branches:
      - claude/android-build

concurrency:
  group: kipmarine-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK and App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SVG icon renderer
        run: npm install --no-save --no-package-lock @resvg/resvg-js

      - name: Render KipMarine app icon
        run: node tooling/render_icon.cjs

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Configure Google Play upload key
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kipmarine-upload.jks"
            {
              echo "storeFile=$RUNNER_TEMP/kipmarine-upload.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            echo "SIGNING=upload-key" >> "$GITHUB_ENV"
            echo "Signature : clé d'envoi Google Play."
          else
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
            echo "::warning::Secrets de signature absents : APK de test uniquement, AAB refusé par Google Play."
          fi

      - name: Compute build number
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Build APK (installation directe)
        run: flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Build App Bundle (Google Play)
        run: flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kipmarine-apk-${{ env.SIGNING }}-${{ env.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: kipmarine-aab-${{ env.SIGNING }}-${{ env.BUILD_NUMBER }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
