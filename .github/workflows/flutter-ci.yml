name: Flutter CI

on:
  push:
    branches:
      - main
      - repair/ios-xcode-project
      - work/v6-global-navigation-audit
  pull_request:
    branches:
      - main
      - repair/ios-xcode-project

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test
