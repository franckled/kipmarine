name: KipMarine Flutter validation

on:
  push:
    branches:
      - feature/v6-mediterranean-ui
  pull_request:
    branches:
      - repair/v5-ios-recovery

permissions:
  contents: read

jobs:
  flutter-validation:
    name: Analyze, test and build iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build iOS (without signing)
        run: flutter build ios --release --no-codesign

      - name: Upload unsigned iOS app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kipmarine-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
